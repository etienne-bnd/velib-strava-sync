name: Synchronisation Vélib' vers Strava

on:
  schedule:
    # Tous les jours à 23h30 UTC (00h30 ou 01h30 à Paris selon la saison).
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : construire les GPX sans rien envoyer sur Strava"
        type: boolean
        default: false
      max_trips:
        description: "Nombre maximum de trajets traités"
        type: string
        default: "25"
      http_backend:
        description: "Moteur HTTP : curl (empreinte Chrome) ou requests (pile Python)"
        type: choice
        options: ["curl", "requests", "auto"]
        default: "curl"
      impersonate:
        description: "Navigateur imité par curl-impersonate (chrome, chrome131, firefox, safari)"
        type: string
        default: "chrome"
      debug_http:
        description: "Vider en-têtes et corps de TOUTES les réponses HTTP, pas seulement des échecs"
        type: boolean
        default: false

# Nécessaire pour que l'étape de commit automatique puisse pousser sur le dépôt.
permissions:
  contents: write

# Une seule exécution à la fois : deux exécutions concurrentes réécriraient
# toutes deux processed_trips.json et provoqueraient des doublons.
concurrency:
  group: velib-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Synchroniser les trajets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        # curl_cffi est distribué en roue manylinux « cp310-abi3 » qui embarque
        # le libcurl patché de curl-impersonate : rien à compiler, aucun paquet
        # système à installer, aucun conteneur Docker à faire tourner. C'est ce
        # qui rend le contournement possible sur un runner hébergé standard.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier le moteur HTTP
        # Garde-fou avant toute requête vers Vélib' : `resolve_backend` lève si
        # le moteur exigé n'est pas installable, ce qui fait échouer cette étape
        # avec un message clair. Sans elle, une roue manquante se manifesterait
        # quinze lignes plus bas sous la forme d'un HTTP 403 — le symptôme même
        # qu'on cherche à éliminer, attribué à la mauvaise cause.
        env:
          VELIB_HTTP_BACKEND: ${{ github.event.inputs.http_backend || 'curl' }}
          VELIB_IMPERSONATE: ${{ github.event.inputs.impersonate || 'chrome' }}
        run: |
          python -c "
          import os, http_client
          print('curl_cffi          :', http_client.curl_version() or 'ABSENT')
          print('moteur exigé       :', os.environ['VELIB_HTTP_BACKEND'])
          print('moteur retenu      :', http_client.resolve_backend())
          print('empreinte demandée :', http_client.impersonate_target())
          "

      - name: Lancer la synchronisation
        env:
          VELIB_USERNAME: ${{ secrets.VELIB_USERNAME }}
          VELIB_PASSWORD: ${{ secrets.VELIB_PASSWORD }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          PROJECT_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MAX_TRIPS_PER_RUN: ${{ github.event.inputs.max_trips || '25' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}

          # `curl` est exigé, pas seulement préféré : avec la valeur « curl »,
          # l'absence de curl_cffi fait échouer le script immédiatement et avec
          # un message clair. Un repli silencieux sur `requests` redonnerait le
          # HTTP 403 sans en expliquer la cause.
          VELIB_HTTP_BACKEND: ${{ github.event.inputs.http_backend || 'curl' }}
          VELIB_IMPERSONATE: ${{ github.event.inputs.impersonate || 'chrome' }}

          # Sur échec, `velib.py` vide de lui-même en-têtes et corps de la
          # réponse fautive. Cette variable étend le vidage à TOUTES les
          # réponses, y compris réussies : utile pour comparer ligne à ligne une
          # exécution locale qui marche et une exécution CI qui échoue.
          VELIB_HTTP_DEBUG: ${{ github.event.inputs.debug_http == 'true' && '1' || '0' }}
        run: python main.py

      - name: Diagnostiquer le pare-feu Cloudflare
        # Ne tourne qu'en cas d'échec de l'étape précédente. La sonde n'utilise
        # AUCUN identifiant — elle s'arrête à la page publique /login — et
        # compare les deux moteurs HTTP depuis cette même IP de runner :
        #
        #   curl passe, requests non  -> l'empreinte TLS était le signal bloquant
        #   les deux échouent         -> c'est l'IP ou une règle WAF (voir le code
        #                                d'erreur 1020/1015 dans le vidage)
        #
        # `continue-on-error` : la sonde documente l'échec, elle ne le juge pas.
        if: failure()
        continue-on-error: true
        env:
          VELIB_IMPERSONATE: ${{ github.event.inputs.impersonate || 'chrome' }}
        run: python probe_cloudflare.py

      - name: Commiter l'état et le référentiel des stations
        # `always()` : même si la synchronisation s'est terminée en erreur, les
        # trajets déjà envoyés doivent être mémorisés, sans quoi ils repartiraient
        # en doublon le lendemain.
        #
        # stations_cache.json est commité lui aussi : l'open data Smovengo est la
        # seule source publiant les identifiants internes de station, et sa
        # disponibilité est irrégulière. Le rafraîchir à chaque exécution réussie
        # constitue un référentiel de secours toujours à jour dans le dépôt.
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mise à jour de l'état et du référentiel [skip ci]"
          file_pattern: |
            processed_trips.json
            stations_cache.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
